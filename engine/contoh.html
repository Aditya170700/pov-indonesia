<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c"></canvas>
<script src="wowo.js"></script>
<script>
// Adegan contoh 10 detik: Wowo jalan -> kaget -> menunjuk kalender -> bicara + subtitle.
const W0 = 1280, H0 = 720;
const q = new URLSearchParams(location.search);
const W = parseInt(q.get('w') || '1280', 10), SC = W / W0;
const cv = document.getElementById('c'); cv.width = W; cv.height = Math.round(H0 * SC);
const ctx = cv.getContext('2d');
window.DURATION = 10;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (x) => { x = clamp(x); return x * x * (3 - 2 * x); };
const backOut = (x) => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const mod = (a, n) => ((a % n) + n) % n;

// ---------- pose ----------
const POSES = {
  stand:   { lf0: 7,  lf1: 5,  lb0: -7,  lb1: -5,  af0: -6,  af1: -4,  ab0: 8,    ab1: 6,    lean: 0 },
  kaget:   { lf0: 10, lf1: 6,  lb0: -10, lb1: -6,  af0: 155, af1: 168, ab0: -155, ab1: -168, lean: -6 },
  point:   { lf0: 7,  lf1: 5,  lb0: -7,  lb1: -5,  af0: 105, af1: 108, ab0: 6,    ab1: 4,    lean: 5 },
  gesture: { lf0: 7,  lf1: 5,  lb0: -7,  lb1: -5,  af0: 70,  af1: 92,  ab0: 8,    ab1: 6,    lean: 3 },
};
const KEYS = [[0, 'stand'], [3.0, 'stand'], [3.12, 'kaget'], [4.3, 'kaget'], [4.7, 'point'], [7.5, 'point'], [8.0, 'gesture'], [9.7, 'gesture'], [10, 'stand']];
function basePose(t) {
  for (let i = 0; i < KEYS.length - 1; i++) {
    const [t0, n0] = KEYS[i], [t1, n1] = KEYS[i + 1];
    if (t >= t0 && t <= t1) {
      const u = t1 === t0 ? 1 : smooth((t - t0) / (t1 - t0)), a = POSES[n0], b = POSES[n1], o = {};
      for (const k in a) o[k] = lerp(a[k], b[k], u);
      return o;
    }
  }
  return { ...POSES.stand };
}

// ---------- gerak latar ----------
const SPEED = 260;
function scrollSpeed(t) { return t < 2.2 ? SPEED : t < 3.0 ? SPEED * (1 - smooth((t - 2.2) / 0.8)) : 0; }
function scrollPos(t) {
  if (t < 2.2) return SPEED * t;
  const x = clamp((t - 2.2) / 0.8);
  return SPEED * (2.2 + 0.8 * (x - x ** 3 + x ** 4 / 2));
}

// ---------- subtitle ----------
const GROUPS = [
  { show: [5.0, 7.8], words: [['COBA', 5.0, 5.5], ['BAYANGIN', 5.5, 6.2], ['KALAU', 6.2, 6.7], ['INDONESIA...', 6.7, 7.6]] },
  { show: [8.0, 10.0], words: [['KAMU', 8.0, 8.4], ['JADI', 8.4, 8.7], ['TOKOH', 8.7, 9.2], ['UTAMANYA', 9.2, 9.9]] },
];
function speaking(t) { return GROUPS.some((g) => g.words.some((w) => t >= w[1] && t < w[2])); }

function drawBackground(t) {
  const S = scrollPos(t);
  const g = ctx.createLinearGradient(0, 0, 0, 600);
  g.addColorStop(0, '#14213D'); g.addColorStop(1, '#22345E');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W0, H0);
  // gedung jauh
  const hs = [120, 180, 90, 150, 200, 110, 160];
  ctx.fillStyle = '#1A2A4B';
  for (let i = 0; i < 14; i++) {
    const x = mod(i * 100 - S * 0.25 + 100, 1400) - 100, h = hs[i % 7];
    ctx.fillRect(x, 600 - h - 40, 82, h + 40);
  }
  // gedung dekat
  ctx.fillStyle = '#182645';
  const hs2 = [210, 150, 260, 180];
  for (let i = 0; i < 8; i++) {
    const x = mod(i * 220 - S * 0.5 + 200, 1760) - 200, h = hs2[i % 4];
    ctx.fillRect(x, 600 - h, 150, h);
    ctx.fillStyle = '#FFC93C33';
    for (let r = 0; r < 4; r++) for (let c = 0; c < 3; c++) if ((i + r + c) % 3) ctx.fillRect(x + 18 + c * 42, 600 - h + 20 + r * 38, 22, 18);
    ctx.fillStyle = '#182645';
  }
  // jalan
  ctx.fillStyle = '#0F1A33'; ctx.fillRect(0, 600, W0, H0 - 600);
  ctx.fillStyle = '#2A3B66'; ctx.fillRect(0, 598, W0, 4);
  ctx.fillStyle = '#FFC93C';
  for (let i = 0; i < 10; i++) { const x = mod(i * 160 - S + 160, 1600) - 160; ctx.fillRect(x, 700, 80, 8); }
}

function drawCalendar(t) {
  const p = backOut((t - 3.3) / 0.5);
  if (t < 3.3 || p <= 0) return;
  const n = t < 4.4 ? 1 : Math.round(1 + 364 * smooth((t - 4.4) / 2.8));
  ctx.save(); ctx.translate(950, 290); ctx.scale(p, p);
  ctx.shadowColor = 'rgba(0,0,0,.45)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10;
  ctx.fillStyle = '#F5F1E8'; ctx.beginPath(); ctx.roundRect(-170, -105, 340, 210, 20); ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.save(); ctx.beginPath(); ctx.roundRect(-170, -105, 340, 210, 20); ctx.clip();
  ctx.fillStyle = '#E63946'; ctx.fillRect(-170, -105, 340, 58); ctx.restore();
  ctx.fillStyle = '#FFFFFF'; ctx.font = '800 30px Poppins, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('HARI KE-', 0, -76);
  ctx.fillStyle = '#14213D'; ctx.font = '800 104px Poppins, Arial, sans-serif'; ctx.fillText(String(n), 0, 22);
  ctx.fillStyle = '#8A8577'; ctx.font = '700 14px Poppins, Arial, sans-serif'; ctx.textAlign = 'right'; ctx.fillText('ILUSTRASI', 156, 90);
  ctx.restore();
}

function drawBang(t) {
  if (t < 3.05 || t > 4.5) return;
  const p = backOut((t - 3.05) / 0.25), fade = 1 - smooth((t - 4.2) / 0.3);
  ctx.save(); ctx.globalAlpha = fade; ctx.translate(470, 225 - 12 * Math.sin(t * 14) * 0.5); ctx.scale(p, p); ctx.rotate(0.12 * Math.sin(t * 16));
  ctx.font = '800 96px Poppins, Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round'; ctx.lineWidth = 12; ctx.strokeStyle = '#0B0B0B'; ctx.strokeText('!', 0, 0);
  ctx.fillStyle = '#FFC93C'; ctx.fillText('!', 0, 0); ctx.restore();
}

function drawSubtitle(t) {
  const grp = GROUPS.find((g) => t >= g.show[0] && t < g.show[1]);
  if (!grp) return;
  ctx.font = '700 46px Poppins, Arial, sans-serif'; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  const gap = 18, widths = grp.words.map((w) => ctx.measureText(w[0]).width);
  const total = widths.reduce((a, b) => a + b, 0) + gap * (grp.words.length - 1);
  let x = (W0 - total) / 2; const y = 650;
  grp.words.forEach((w, i) => {
    const active = t >= w[1] && t < w[2];
    if (active) {
      ctx.fillStyle = '#FFC93C'; ctx.beginPath(); ctx.roundRect(x - 10, y - 34, widths[i] + 20, 68, 10); ctx.fill();
      ctx.fillStyle = '#0B0B0B'; ctx.fillText(w[0], x, y + 2);
    } else {
      ctx.lineJoin = 'round'; ctx.lineWidth = 9; ctx.strokeStyle = '#0B0B0B'; ctx.strokeText(w[0], x, y + 2);
      ctx.fillStyle = '#FFFFFF'; ctx.fillText(w[0], x, y + 2);
    }
    x += widths[i] + gap;
  });
}

function renderFrame(t) {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  drawBackground(t);
  drawCalendar(t);

  // pose + jalan
  const base = basePose(t), amp = scrollSpeed(t) / SPEED, ph = (scrollPos(t) / 150) * Math.PI * 2;
  const wk = {
    lf0: 30 * Math.sin(ph), lf1: 30 * Math.sin(ph) - 35 * Math.max(0, Math.cos(ph)),
    lb0: -30 * Math.sin(ph), lb1: -30 * Math.sin(ph) - 35 * Math.max(0, -Math.cos(ph)),
    af0: -28 * Math.sin(ph), af1: -28 * Math.sin(ph) + 22, ab0: 28 * Math.sin(ph), ab1: 28 * Math.sin(ph) + 22, lean: 4,
  };
  const P = {};
  for (const k in base) P[k] = lerp(base[k], wk[k] !== undefined ? wk[k] : base[k], amp);
  const gw = smooth((t - 7.9) / 0.2) * (1 - smooth((t - 9.6) / 0.2)); // goyang tangan saat gestur
  P.af0 += 8 * Math.sin(t * 5) * gw; P.af1 += 10 * Math.sin(t * 5 + 0.6) * gw;
  const bob = 4 * Math.abs(Math.sin(ph)) * amp + 24 * Math.sin(Math.PI * clamp((t - 3.0) / 0.4));

  let face;
  if (t >= 3.0 && t < 4.4) face = { mode: 'wow', look: 0.6 };
  else if (speaking(t)) face = { mode: 'talk', mouth: 0.5 + 0.5 * Math.abs(Math.sin(t * 17)), look: t > 4.7 ? 0.5 : 0 };
  else face = { mode: 'smile', blink: mod(t, 3.2) < 0.12, look: t > 4.7 ? 0.5 : 0 };

  WOWO.drawWowo(ctx, {
    x: 420, groundY: 600, k: 1.5, lean: P.lean, bob,
    legF: [P.lf0, P.lf1], legB: [P.lb0, P.lb1], armF: [P.af0, P.af1], armB: [P.ab0, P.ab1], face,
  });
  drawBang(t);
  drawSubtitle(t);
}
window.renderFrame = renderFrame;
window.ready = document.fonts.load('800 20px Poppins').then(() => document.fonts.load('700 20px Poppins'));
</script></body></html>
